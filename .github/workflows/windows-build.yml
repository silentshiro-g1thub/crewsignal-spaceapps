name: Windows build

on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'package.json'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install Rust 1.96
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          rustc --version
      - run: npm run setup:windows
      - run: npm run typecheck --prefix desktop
      - run: npm test --prefix desktop
      - run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml
      - run: npm run tauri:build --prefix desktop -- --target x86_64-pc-windows-msvc --config src-tauri/tauri.offline.conf.json -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: crewsignal-windows-x64-offline-candidate
          path: desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
